<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nueva contraseña · Calendario de contenidos</title>
  <link rel="icon" type="image/png" href="favicon-cosmart.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css?v=2">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-marca"><img src="cosmart-logo.png" alt="COSMART"><strong>Elegí tu contraseña nueva</strong></div>
  <form class="auth-card" id="form-reset" novalidate>
    <div class="campo"><label for="rp-pass">Contraseña nueva (mínimo 8 caracteres)</label><input type="password" id="rp-pass" autocomplete="new-password" minlength="8" required></div>
    <div class="campo"><label for="rp-pass2">Repetila</label><input type="password" id="rp-pass2" autocomplete="new-password" required></div>
    <button type="submit" class="btn-rojo" id="rp-btn">Guardar contraseña</button>
    <div class="msg" id="rp-msg" role="alert"></div>
    <a class="auth-link oculto" id="rp-ir" href="login.html">Ir a ingresar</a>
  </form>
</main>
<script type="module">
import { restablecerClave } from './js/auth.js';
const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('token');
$('form-reset').addEventListener('submit', async e => {
  e.preventDefault();
  const m = $('rp-msg'); m.className = 'msg'; m.textContent = '';
  const p = $('rp-pass').value;
  if (!token) { m.className = 'msg error'; m.textContent = 'El link no es válido. Pedí uno nuevo desde "¿Olvidaste tu contraseña?".'; return; }
  if (p.length < 8) { m.className = 'msg error'; m.textContent = 'La contraseña tiene que tener al menos 8 caracteres.'; return; }
  if (p !== $('rp-pass2').value) { m.className = 'msg error'; m.textContent = 'Las contraseñas no coinciden.'; return; }
  $('rp-btn').disabled = true;
  try {
    await restablecerClave(token, p);
    m.className = 'msg ok'; m.textContent = 'Listo, tu contraseña quedó actualizada.';
    $('rp-ir').classList.remove('oculto'); $('rp-btn').classList.add('oculto');
  } catch (err) { m.className = 'msg error'; m.textContent = err.status === 403 ? 'El link venció. Pedí uno nuevo.' : err.message; $('rp-btn').disabled = false; }
});
</script>
</body>
</html>
